hazard: "respiratory_air_quality"
version: "1.0.0"
jurisdiction: "demo_fictional"
sector: "manufacturing_and_warehousing"
source_link: "https://open-meteo.com/en/docs/air-quality-api"
approval_status: "approved"
evidence_requirements:
  min_signal_families: 2
  required_families: ["environmental"]
contraindications:
  - "Do not prescribe prescription respirators without prior fit-testing and medical clearance."
  - "Do not attribute personal medical diagnoses to factory environmental conditions."

action_tiers:
  tier_1_preparation:
    title: "Air Quality Watch: Inspect HVAC & Air Filtration Systems"
    action: "Check differential pressure across HEPA and carbon filters; inspect building seal integrity in enclosed production bays."
    accountable_role: "workplace_safety_manager"
    approval_role: null
    review_window_hours: 24
    completion_evidence_required: "HVAC maintenance log sign-off"

  tier_2_adjusted_operations:
    title: "Air Quality Warning: Minimize Outdoor High-Exertion Operations"
    action: "Postpone high-dust yard operations and heavy diesel material handling during elevated PM2.5 periods. Distribute approved particulate masks for required outdoor transit."
    accountable_role: "workplace_safety_manager"
    approval_role: "occupational_health_analyst"
    review_window_hours: 12
    completion_evidence_required: "Outdoor task postponement log"


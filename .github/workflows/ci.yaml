name: SentinelHealth CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install backend dependencies
        run: |
          cd backend
          uv pip install --system -e ".[dev]"
      - name: Lint and Format (Ruff)
        run: |
          cd backend
          ruff check app/
      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          pytest tests/ -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:run

  replay-evaluation:
    runs-on: ubuntu-latest
    needs: [backend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv pip install --system -e ".[dev]"
      - name: Execute Chronological Replay Evaluation
        run: |
          cd backend
          python -m app.replay.runner --scenario=heat-gradual


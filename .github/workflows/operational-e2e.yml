name: Operational Live Browser Acceptance (E2E)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'compose.yaml'
      - 'compose.prod.yaml'
      - 'tests/e2e/**'
      - '.github/workflows/operational-e2e.yml'

jobs:
  operational-acceptance:
    name: Full-Stack Live Browser Acceptance Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Test Runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright requests
          playwright install --with-deps chromium

      - name: Configure Test Environment Variables
        run: |
          cat << 'EOF' > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ephemeral_test_postgres_pass
          POSTGRES_DB=sentinelhealth
          MIGRATOR_DB_USER=sentinel_migrator
          MIGRATOR_DB_PASSWORD=ephemeral_migrator_pass_2024
          APP_DB_USER=sentinel_app
          APP_DB_PASSWORD=ephemeral_app_pass_2024

          SENTINEL_ENVIRONMENT=local
          SENTINEL_DEMO_MODE=true
          CELERY_TASK_ALWAYS_EAGER=false

          SENTINEL_DATABASE_URL=postgresql+asyncpg://sentinel_app:ephemeral_app_pass_2024@postgres:5432/sentinelhealth
          SENTINEL_MIGRATION_DATABASE_URL=postgresql+asyncpg://sentinel_migrator:ephemeral_migrator_pass_2024@postgres:5432/sentinelhealth
          SENTINEL_REDIS_URL=redis://redis:6379/0

          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=ephemeral_keycloak_admin_pass
          SENTINEL_KEYCLOAK_URL=http://keycloak:8080
          SENTINEL_OIDC_ISSUER=http://localhost:8081/realms/sentinelhealth
          SENTINEL_OIDC_AUDIENCE=sentinel-api

          VITE_API_BASE_URL=http://localhost:8000/api/v1
          VITE_KEYCLOAK_URL=http://localhost:8081
          VITE_KEYCLOAK_REALM=sentinelhealth
          VITE_KEYCLOAK_CLIENT_ID=sentinel-frontend
          EOF

      - name: Start Full-Stack Services via Docker Compose
        run: |
          docker compose up -d postgres redis keycloak
          echo "[*] Waiting for PostgreSQL, Redis, and Keycloak readiness..."
          
          # Wait for Postgres
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -d sentinelhealth; do sleep 2; done'
          
          # Wait for Redis
          timeout 30 bash -c 'until docker compose exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done'
          
          # Run database migrations
          echo "[*] Executing database migrations..."
          docker compose run --rm migrate

          # Wait for Keycloak readiness (management health :9001 + imported realm)
          echo "[*] Waiting for Keycloak readiness..."
          if ! timeout 180 bash -c 'until curl -sf http://127.0.0.1:9001/health/ready >/dev/null; do sleep 3; done'; then
            echo "[!] Keycloak management health did not become ready"
            docker compose ps
            docker compose logs --no-color --tail=200 keycloak || true
            exit 1
          fi
          if ! timeout 120 bash -c 'until curl -sf http://127.0.0.1:8081/realms/sentinelhealth >/dev/null; do sleep 3; done'; then
            echo "[!] Keycloak realm sentinelhealth not importable/reachable"
            docker compose logs --no-color --tail=200 keycloak || true
            exit 1
          fi

          # Seed demo fixtures as migrator (BYPASSRLS / DDL owner). App role is DML-only.
          echo "[*] Seeding demo surveillance fixtures..."
          docker compose run --rm --no-deps \
            -e SENTINEL_DATABASE_URL="postgresql+asyncpg://sentinel_migrator:ephemeral_migrator_pass_2024@postgres:5432/sentinelhealth" \
            api python -m app.db.seed_demo

          # Start API, Celery Worker, Frontend, and Nginx
          echo "[*] Starting API, non-eager Celery worker, Frontend, and Nginx..."
          docker compose up -d api worker frontend nginx

          # Wait for API live check
          timeout 90 bash -c 'until curl -s -f http://localhost:8000/health/live; do sleep 2; done'
          
          # Wait for Frontend / Nginx
          timeout 90 bash -c 'until curl -s -f http://localhost:8080/; do sleep 2; done'
          echo "[+] Full stack is healthy and operational."

      - name: Run Playwright Browser Acceptance Test
        env:
          SENTINEL_FRONTEND_URL: "http://localhost:8080"
          SENTINEL_API_URL: "http://localhost:8000"
          SENTINEL_KEYCLOAK_URL: "http://localhost:8081"
          SENTINEL_TEST_USER_1: "safety@demo.local"
          SENTINEL_TEST_PASS_1: "demo123"
          SENTINEL_TEST_USER_2: "regulator@demo.local"
          SENTINEL_TEST_PASS_2: "demo123"
        run: |
          python -m pytest tests/e2e/test_live_browser_workflow.py -v --tb=short

      - name: Tear Down and Clean Up Test Containers
        if: always()
        run: |
          echo "[*] Cleaning up test containers and volumes..."
          docker compose down -v --remove-orphans
          rm -f .env

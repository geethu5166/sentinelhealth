[project]
name = "sentinelhealth"
version = "0.1.0"
description = "SentinelHealth – occupational & environmental health surveillance platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "geoalchemy2==0.15.2",
    "shapely==2.0.6",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "scipy==1.15.0",
    "statsmodels==0.14.4",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "factory-boy==3.3.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

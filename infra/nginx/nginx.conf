worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:8081; font-src 'self';" always;

    upstream api {
        server api:8000;
    }

    upstream frontend_dev {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check for nginx itself
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # API routes
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Health endpoints
        location /health/live {
            proxy_pass http://api/health/live;
        }
        location /health/ready {
            proxy_pass http://api/health/ready;
        }

        # OpenAPI docs
        location /docs {
            proxy_pass http://api/docs;
        }
        location /openapi.json {
            proxy_pass http://api/openapi.json;
        }

        # Frontend (dev server proxy)
        location / {
            proxy_pass http://frontend_dev;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }
    }
}
